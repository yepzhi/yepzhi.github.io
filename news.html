<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Updates | Alberto Yépiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            background-image:
                radial-gradient(at 27% 37%, hsla(215, 98%, 61%, 0.15) 0px, transparent 50%),
                radial-gradient(at 97% 21%, hsla(125, 98%, 72%, 0.1) 0px, transparent 50%),
                radial-gradient(at 52% 99%, hsla(354, 98%, 61%, 0.1) 0px, transparent 50%),
                radial-gradient(at 10% 29%, hsla(256, 96%, 67%, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .glass-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 40px;
            margin-bottom: 24px;
            position: relative;
        }

        .header-nav {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .back-btn {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5em;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1em;
        }

        .twitter-wrapper {
            width: 100%;
            min-height: 600px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            overflow: hidden;
        }

        /* Customize Scrollbar for the container */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 32px;
            font-size: 0.9em;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .glass-container {
                padding: 24px 20px;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>

<body>

    <div class="header-nav">
        <a href="index.html" class="back-btn">
            <span>‹</span> Back to Home
        </a>
        <div style="font-weight: 700; font-size: 1.1em; color: rgba(255,255,255,0.9);">@Yepzhi News</div>
    </div>

    <div class="container">
        <div class="glass-container">
            <div class="header">
                <h1>Latest Updates</h1>
                <p>Thoughts, tech, and random bits from X (Twitter)</p>
            </div>

            <div class="twitter-wrapper">
                <a class="twitter-timeline" data-width="100%" data-height="800" data-theme="dark"
                    data-chrome="noborders transparent" href="https://twitter.com/Yepzhi?ref_src=twsrc%5Etfw">
                    Loading Tweets by @Yepzhi...
                </a>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>Developed by <a href="https://github.com/yepzhi" target="_blank">@yepzhi</a></p>
    </div>

    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

</body>

</html>
