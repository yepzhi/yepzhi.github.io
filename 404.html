<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Página no encontrada | yepzhi.com</title>
    <script type="text/javascript">
        // Mapping of lowercase URLs to their correct GitHub Pages repo casing
        const projectMap = {
            'propass': '/ProPass',
            'ytdownloader': '/ytDownloader',
            'nearly': '/nearly',
            'nearly-app': '/Nearly',
            'richmondbot': '/richmondbot',
            'sergradio': '/SERGRadio',
            'hopradio': '/hopRadio',
            'rprodash': '/RProDash',
            'proassistant': '/ProAssistant',
            'daltonweb': '/Daltonweb',
            'eventseeker': '/eventseeker',
            'sensorapp': '/sensor-monitor',
            'sensor-monitor': '/sensor-monitor',
            'socialapp': '/tools',
            'tools': '/tools',
            'citas': '/citas',
            'cbsalon': '/citas',
            'hotfact': '/hotfact',
            'richmond-token-check': '/richmond-token-check',
            'neosys': '/neosys',
            'neosysaeon': '/neosys',
            'visitors': '/visitors',
            'lot': '/lot',
            'entrytest': '/entrytest',
            'finaltest': '/finaltest',
            'bluechat': '/bluechat',
            'jovenesstem': '/jovenesstem',
            'jovenesstemdata': '/jovenesstemData'
        };

        // Extract and normalize the path (strip .html)
        const path = window.location.pathname.replace(/\.html$/, '');
        const pathSegments = path.split('/');
        const rootPath = pathSegments[1] ? pathSegments[1].toLowerCase() : '';

        // If it's stemos, redirect to the new domain
        if (rootPath === 'stemos') {
            const extraPath = pathSegments.slice(2).join('/');
            window.location.replace('https://stemos.org' + (extraPath ? '/' + extraPath : '') + window.location.search + window.location.hash);
        } else if (rootPath && projectMap[rootPath]) {
            const redirectPath = projectMap[rootPath] + (pathSegments.slice(2).join('/') ? '/' + pathSegments.slice(2).join('/') : '');
            window.location.replace(window.location.origin + redirectPath + window.location.search + window.location.hash);
        } else {
            // Default 404 behavior: Redirect to home after 3 seconds or show a message
            setTimeout(() => {
                window.location.replace('/');
            }, 3000);
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f9fc;
            color: #1d1d1f;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px;
        }
        h1 { font-size: 48px; margin-bottom: 10px; color: #FF0054; }
        p { color: #6e6e73; font-size: 16px; line-height: 1.5; }
        .spinner {
            margin: 20px auto;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 0, 84, 0.1);
            border-top: 3px solid #FF0054;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Buscando el sitio correcto...</p>
        <div class="spinner"></div>
        <p>Si no eres redirigido en 3 segundos, serás enviado a la página principal.</p>
    </div>
</body>
</html>
