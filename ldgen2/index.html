<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Richmond Pro · Admin Leads</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#03050e;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.09);
      --border-hi:rgba(255,255,255,0.18);--accent:#1e7aff;--accent2:#38b6ff;
      --gold:#f4c94e;--text:#eef0fb;--muted:rgba(220,226,255,0.45);
      --success:#34d399;--error:#ff5f5f;--blur:40px;
      --btn:linear-gradient(145deg,#2d8fff 0%,#0e5fd8 60%,#0a47b8 100%);
    }
    html{scroll-behavior:smooth}
    body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
    .orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.2;animation:drift 18s ease-in-out infinite}
    .orb-1{width:500px;height:500px;background:radial-gradient(circle,#1e7aff,transparent 70%);top:-150px;left:-100px}
    .orb-2{width:400px;height:400px;background:radial-gradient(circle,#38b6ff,transparent 70%);bottom:-100px;right:-80px;animation-delay:-8s}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-15px)}}

    /* LOGIN */
    #loginGate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .login-card{
      background:rgba(255,255,255,0.05);backdrop-filter:blur(var(--blur));
      border:1px solid var(--border-hi);border-radius:28px;
      box-shadow:0 40px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.07) inset;
      padding:3rem 2.5rem;width:100%;max-width:400px;text-align:center;position:relative;overflow:hidden;
    }
    .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.06),transparent);pointer-events:none}
    .login-logo{font-size:2rem;font-weight:800;margin-bottom:.25rem}
    .login-logo strong{color:var(--accent2)}
    .login-sub{color:var(--muted);font-size:.8rem;margin-bottom:2rem;text-transform:uppercase;letter-spacing:.06em}
    .login-input{
      width:100%;padding:.9rem 1rem;
      background:rgba(255,255,255,0.05);backdrop-filter:blur(16px);
      border:1px solid var(--border);border-top-color:var(--border-hi);
      border-radius:14px;color:var(--text);font-family:inherit;font-size:1rem;
      outline:none;margin-bottom:1rem;transition:all .3s;
    }
    .login-input:focus{border-color:rgba(30,122,255,.5);box-shadow:0 0 0 3px rgba(30,122,255,.12)}
    .login-btn{
      width:100%;padding:.9rem;background:var(--btn);
      border:1px solid rgba(100,180,255,.35);border-top-color:rgba(180,220,255,.4);border-radius:14px;
      color:#fff;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;
      box-shadow:0 4px 24px rgba(30,122,255,.4),0 1px 0 rgba(255,255,255,.2) inset;
      position:relative;overflow:hidden;transition:all .3s;
    }
    .login-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.25),transparent 45%);pointer-events:none}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(30,122,255,.5)}
    .login-err{color:var(--error);font-size:.82rem;margin-top:.5rem;min-height:1.2rem}

    /* APP */
    #app{display:none;position:relative;z-index:1;min-height:100dvh;padding:1.5rem;max-width:1200px;margin:0 auto}
    .admin-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.75rem}
    .admin-logo{font-size:1.5rem;font-weight:800}
    .admin-logo strong{color:var(--accent2)}
    .admin-logo span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
    .header-btns{display:flex;gap:.6rem;flex-wrap:wrap}

    .btn-action{
      display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;
      border-radius:100px;font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .3s;border:1px solid;
    }
    .btn-csv{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:var(--success)}
    .btn-csv:hover{background:rgba(52,211,153,.2)}
    .btn-refresh{background:rgba(30,122,255,.1);border-color:rgba(30,122,255,.3);color:var(--accent2)}
    .btn-refresh:hover{background:rgba(30,122,255,.2)}
    .btn-logout{background:rgba(255,255,255,.04);border-color:var(--border);color:var(--muted)}
    .btn-logout:hover{color:var(--text);border-color:rgba(255,255,255,.2)}

    /* Stats */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem;margin-bottom:1.5rem}
    .stat-card{
      background:var(--surface);backdrop-filter:blur(var(--blur));
      border:1px solid var(--border);border-top-color:var(--border-hi);border-radius:18px;padding:1rem 1.2rem;
    }
    .stat-val{font-size:2.2rem;font-weight:800;line-height:1}
    .stat-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:.3rem}
    .s-blue .stat-val{color:var(--accent2)}
    .s-green .stat-val{color:var(--success)}
    .s-gold .stat-val{color:var(--gold)}
    .s-pink .stat-val{color:#f97ab0}

    /* Filters */
    .filters{
      background:var(--surface);backdrop-filter:blur(var(--blur));
      border:1px solid var(--border);border-radius:16px;
      padding:.85rem 1.1rem;display:flex;flex-wrap:wrap;gap:.65rem;margin-bottom:.85rem;align-items:center;
    }
    .fi{
      padding:.48rem .85rem;background:rgba(255,255,255,.04);
      border:1px solid var(--border);border-radius:10px;
      color:var(--text);font-family:inherit;font-size:.84rem;outline:none;transition:all .3s;
    }
    .fi-search{flex:1;min-width:200px}
    .fi::placeholder{color:var(--muted)}
    .fi:focus{border-color:rgba(30,122,255,.4);box-shadow:0 0 0 2px rgba(30,122,255,.1)}
    select.fi option{background:#0a0d1e}
    .fc{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap}

    /* Table */
    .table-wrap{
      background:var(--surface);backdrop-filter:blur(var(--blur));
      border:1px solid var(--border);border-top-color:var(--border-hi);
      border-radius:20px;overflow:hidden;
    }
    .tbl{width:100%;border-collapse:collapse;font-size:.84rem}
    .tbl th{
      padding:.8rem 1rem;text-align:left;font-size:.7rem;text-transform:uppercase;
      letter-spacing:.07em;color:var(--muted);font-weight:600;
      border-bottom:1px solid var(--border);background:rgba(255,255,255,.02);white-space:nowrap;
    }
    .tbl td{padding:.75rem 1rem;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
    .tbl tbody tr:last-child td{border-bottom:none}
    .tbl tbody tr:hover td{background:rgba(255,255,255,.025);cursor:default}

    .badge{display:inline-flex;align-items:center;padding:.18rem .6rem;border-radius:100px;font-size:.7rem;font-weight:600;white-space:nowrap}
    .b-contact{background:rgba(30,122,255,.15);color:#60a5fa;border:1px solid rgba(30,122,255,.3)}
    .b-webinar{background:rgba(167,139,250,.15);color:#c4b5fd;border:1px solid rgba(167,139,250,.3)}
    .b-si{background:rgba(52,211,153,.12);color:var(--success);border:1px solid rgba(52,211,153,.3)}
    .b-no{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}
    .b-pub{background:rgba(56,182,255,.1);color:var(--accent2);border:1px solid rgba(56,182,255,.25)}
    .b-priv{background:rgba(244,201,78,.1);color:var(--gold);border:1px solid rgba(244,201,78,.25)}

    .wa-lnk{
      display:inline-flex;align-items:center;gap:.3rem;padding:.28rem .65rem;
      background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.3);
      border-radius:8px;color:#34d399;text-decoration:none;font-size:.76rem;font-weight:600;transition:all .25s;white-space:nowrap;
    }
    .wa-lnk:hover{background:rgba(37,211,102,.2)}
    .muted{color:var(--muted)}
    .fw6{font-weight:600}
    .date-s{font-size:.75rem;white-space:nowrap;color:var(--muted)}

    .center-msg{text-align:center;padding:3rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.75rem}
    .spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:700px){
      #app{padding:1rem}
      .tbl th:nth-child(n+6),.tbl td:nth-child(n+6){display:none}
      .stats-grid{grid-template-columns:repeat(3,1fr)}
      .stat-val{font-size:1.6rem}
    }
  </style>
</head>
<body>
<div class="orbs" aria-hidden="true">
  <div class="orb orb-1"></div><div class="orb orb-2"></div>
</div>

<!-- LOGIN -->
<div id="loginGate">
  <div class="login-card">
    <div class="login-logo">Richmond <strong>Pro</strong></div>
    <div class="login-sub">Panel de Leads · Acceso interno</div>
    <input type="password" class="login-input" id="pwInput" placeholder="Contraseña"
      onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="admin-header">
    <div class="admin-logo">
      Richmond <strong>Pro</strong>
      <span>Registro de Leads · Panel Interno</span>
    </div>
    <div class="header-btns">
      <button class="btn-action btn-refresh" onclick="loadLeads()">
        <svg viewBox="0 0 20 20" fill="none" width="13" height="13"><path d="M4 10a6 6 0 1 0 1.2-3.6M4 6v4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Actualizar
      </button>
      <button class="btn-action btn-csv" onclick="exportCSV()">
        <svg viewBox="0 0 20 20" fill="none" width="13" height="13"><path d="M10 3v10M6 9l4 4 4-4M4 15h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Exportar CSV
      </button>
      <button class="btn-action btn-logout" onclick="doLogout()">
        <svg viewBox="0 0 20 20" fill="none" width="13" height="13"><path d="M13 3h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-3M9 14l4-4-4-4M2 10h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Salir
      </button>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card s-blue"><div class="stat-val" id="sTotal">–</div><div class="stat-label">Total Leads</div></div>
    <div class="stat-card"><div class="stat-val" id="sContact">–</div><div class="stat-label">Contacto</div></div>
    <div class="stat-card s-pink"><div class="stat-val" id="sWebinar">–</div><div class="stat-label">Webinar</div></div>
    <div class="stat-card s-green"><div class="stat-val" id="sPub">–</div><div class="stat-label">Pública</div></div>
    <div class="stat-card s-gold"><div class="stat-val" id="sPriv">–</div><div class="stat-label">Privada</div></div>
    <div class="stat-card"><div class="stat-val" id="sProv">–</div><div class="stat-label">Con proveedor</div></div>
  </div>

  <div class="filters">
    <input type="text" class="fi fi-search" id="search" placeholder="Buscar nombre, email, universidad…" oninput="applyFilters()"/>
    <select class="fi" id="fInt" onchange="applyFilters()"><option value="">Todos</option><option value="contact">Contacto</option><option value="webinar">Webinar</option></select>
    <select class="fi" id="fTipo" onchange="applyFilters()"><option value="">Tipo</option><option value="gobierno">Pública</option><option value="privada">Privada</option></select>
    <select class="fi" id="fRol" onchange="applyFilters()"><option value="">Puesto</option><option value="Profesor">Profesor</option><option value="Coordinador">Coordinador</option><option value="Director">Director</option><option value="Otro">Otro</option></select>
    <span class="fc" id="fc"></span>
  </div>

  <div class="table-wrap">
    <div id="tc"><div class="center-msg"><div class="spin"></div>Cargando…</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, orderBy, query }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const PASS = 'Richmond2026';
const cfg  = {
  apiKey:"AIzaSyCdszta7w3yg1zLeHDrPlo4Kln63K2Ftks",
  authDomain:"leadgen-ca3c9.firebaseapp.com",
  projectId:"leadgen-ca3c9",
  storageBucket:"leadgen-ca3c9.firebasestorage.app",
  messagingSenderId:"436445053383",
  appId:"1:436445053383:web:e7c99ece8753f6a56d59e2"
};
const db = getFirestore(initializeApp(cfg));

let all = [], filt = [];

// ── Auth ──
window.doLogin = () => {
  const v = document.getElementById('pwInput').value;
  if (v === PASS) {
    sessionStorage.setItem('rp2','1');
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadLeads();
  } else {
    document.getElementById('loginErr').textContent = 'Contraseña incorrecta';
  }
};
window.doLogout = () => { sessionStorage.removeItem('rp2'); location.reload(); };

if (sessionStorage.getItem('rp2')) {
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadLeads();
}

// ── Load ──
window.loadLeads = async () => {
  document.getElementById('tc').innerHTML = '<div class="center-msg"><div class="spin"></div>Cargando…</div>';
  try {
    const snap = await getDocs(query(collection(db,'leads'), orderBy('createdAt','desc')));
    all = snap.docs.map(d => ({id:d.id,...d.data()}));
    updateStats(all);
    applyFilters();
  } catch(e) {
    document.getElementById('tc').innerHTML =
      `<div class="center-msg">⚠️ Error: ${e.message}<br><small>Verifica que las Firestore Security Rules permitan lectura.</small></div>`;
  }
};

// ── Stats ──
function updateStats(d) {
  document.getElementById('sTotal').textContent   = d.length;
  document.getElementById('sContact').textContent = d.filter(l=>l.intention==='contact').length;
  document.getElementById('sWebinar').textContent = d.filter(l=>l.intention==='webinar').length;
  document.getElementById('sPub').textContent     = d.filter(l=>l.instType==='gobierno').length;
  document.getElementById('sPriv').textContent    = d.filter(l=>l.instType==='privada').length;
  document.getElementById('sProv').textContent    = d.filter(l=>l.hasProvider==='si').length;
}

// ── Filters ──
window.applyFilters = () => {
  const s  = document.getElementById('search').value.toLowerCase();
  const fi = document.getElementById('fInt').value;
  const ft = document.getElementById('fTipo').value;
  const fr = document.getElementById('fRol').value;
  filt = all.filter(l => {
    const t = `${l.firstName} ${l.lastName} ${l.email} ${l.university}`.toLowerCase();
    return (!s||t.includes(s))&&(!fi||l.intention===fi)&&(!ft||l.instType===ft)&&(!fr||l.role===fr);
  });
  document.getElementById('fc').textContent = `${filt.length} de ${all.length}`;
  render(filt);
};

// ── Render ──
function fmt(l) {
  return l.createdAt?.toDate
    ? l.createdAt.toDate().toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'})
    : '–';
}
function render(leads) {
  if (!leads.length) {
    document.getElementById('tc').innerHTML = '<div class="center-msg">Sin resultados</div>';
    return;
  }
  const rows = leads.map(l => `
    <tr>
      <td class="date-s">${fmt(l)}</td>
      <td class="fw6">${l.firstName||''} ${l.lastName||''}</td>
      <td class="muted">${l.university||'–'}</td>
      <td>${l.state||'–'}</td>
      <td>${l.role||'–'}</td>
      <td>${l.intention==='contact'?'<span class="badge b-contact">Contacto</span>':'<span class="badge b-webinar">Webinar</span>'}</td>
      <td>${l.instType==='gobierno'?'<span class="badge b-pub">Pública</span>':'<span class="badge b-priv">Privada</span>'}</td>
      <td>${l.hasProvider==='si'?`<span class="badge b-si">Sí${l.providerName?' · '+l.providerName:''}</span>`:'<span class="badge b-no">No</span>'}</td>
      <td class="muted" style="font-size:.78rem">${l.email||'–'}</td>
      <td>${l.whatsapp?`<a class="wa-lnk" href="https://wa.me/52${l.whatsapp}" target="_blank"><svg viewBox="0 0 20 20" fill="none" width="12" height="12"><path d="M14 12.5c-.5-.25-2-.98-2.3-1.08-.3-.1-.52-.15-.74.15-.22.3-.85 1.08-1.04 1.3-.19.22-.38.25-.7.08-.32-.17-1.35-.5-2.57-1.58-.95-.84-1.59-1.88-1.77-2.2-.19-.32-.02-.49.14-.65.14-.14.32-.38.48-.57.16-.19.21-.32.32-.54.1-.22.05-.41-.02-.57C5.68 7.16 5.05 5.5 4.8 4.92c-.25-.57-.5-.5-.7-.5-.18 0-.4-.02-.61-.02-.22 0-.57.08-.87.41C2.32 5.14 1.5 5.9 1.5 7.5s1.06 3.18 1.21 3.4c.15.22 2.1 3.2 5.08 4.49 4.5 1.94 4.5 1.29 5.31 1.21.81-.08 2.61-1.07 2.98-2.1.37-1.03.37-1.92.26-2.1-.11-.18-.3-.27-.81-.52z" fill="currentColor"/></svg> WA</a>`:'–'}</td>
    </tr>`).join('');
  document.getElementById('tc').innerHTML = `
    <table class="tbl">
      <thead><tr>
        <th>Fecha</th><th>Nombre</th><th>Universidad</th><th>Estado</th>
        <th>Puesto</th><th>Interés</th><th>Tipo</th><th>Proveedor</th><th>Email</th><th>WA</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── CSV ──
window.exportCSV = () => {
  const data = filt.length ? filt : all;
  const h = ['Fecha','Nombre','Apellido','Email','WhatsApp','Universidad','Tipo','Estado','Proveedor','Nombre Proveedor','Puesto','Comentario','Interés'];
  const rows = data.map(l => [
    fmt(l),l.firstName,l.lastName,l.email,
    l.whatsapp?`+52${l.whatsapp}`:'',
    l.university,
    l.instType==='gobierno'?'Pública':'Privada',
    l.state,
    l.hasProvider==='si'?'Sí':'No',
    l.providerName||'',l.role,l.roleComment||'',
    l.intention==='contact'?'Contacto':'Webinar'
  ].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));
  const csv  = [h.join(','),...rows].join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'),{href:url,download:`richmond-leads-${new Date().toISOString().slice(0,10)}.csv`});
  a.click(); URL.revokeObjectURL(url);
};
</script>
</body>
</html>
